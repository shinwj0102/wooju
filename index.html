    .field-label {

    .input, .select, .textarea {

    .modal-panel {
      width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto;
      background: #fff; border: 1px solid var(--border);
      border-radius: 20px 20px 0 0; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.22);
    }
    @media (min-width: 640px) {
      .modal-panel { border-radius: 18px; }
    }
    .modal-head {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 20px; background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border-slate);
    }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 10px; border: 0;
      background: transparent; color: var(--text-subtle);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: #f1f5f9; color: var(--text); }

    /* Chat */
    .chat-box {
      display: flex; flex-direction: column; gap: 12px;
      max-height: 460px; overflow-y: auto; padding: 4px 2px;
    }
    .chat-msg {
      max-width: 86%; padding: 12px 15px; border-radius: 14px;
      font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .chat-msg.user {
      align-self: flex-end; background: var(--primary); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.assistant {
      align-self: flex-start; background: var(--surface-soft); color: var(--text);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 80;
      background: #022c22; color: #fff; border-radius: 12px;
      padding: 10px 16px; font-size: 13px; font-weight: 500;
      box-shadow: 0 12px 24px rgba(2, 44, 34, 0.28);
      display: flex; align-items: center; gap: 12px; max-width: 92vw;
    }

    /* Footer */
    .app-footer {
      margin-top: 32px; background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 18px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>

    function getTodayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function isValidDateStr(dateStr) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '')) return false;
      const parts = dateStr.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return d.getFullYear() === parts[0] && d.getMonth() === parts[1] - 1 && d.getDate() === parts[2];
    }

    function parseLocalDate(dateStr) {
      if (!isValidDateStr(dateStr)) return null;
      const p = dateStr.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }

    function addDays(dateStr, days) {
      const base = parseLocalDate(dateStr) || parseLocalDate(getTodayStr());
      const next = new Date(base);
      next.setDate(next.getDate() + Math.round(Number(days) || 0));
      return next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0') + '-' + String(next.getDate()).padStart(2, '0');
    }

    function diffDaysFromToday(targetDateStr) {
      const target = parseLocalDate(targetDateStr);
      const today = parseLocalDate(getTodayStr());
      if (!target || !today) return null;
      return Math.round((target.getTime() - today.getTime()) / 86400000);
    }

    function formatKoreanDate(dateStr) {
      if (!isValidDateStr(dateStr)) return dateStr || '-';
      const p = dateStr.split('-').map(Number);
      return p[1] + '월 ' + p[2] + '일';
    }

    function formatDueBadge(dateStr) {
      const diff = diffDaysFromToday(dateStr);
      if (diff === null) return '일정 미정';
      if (diff < 0) return Math.abs(diff) + '일 지남';
      if (diff === 0) return '오늘';
      if (diff === 1) return '내일';
      return diff + '일 후';
    }

    function computeNextWateringCheckDate(plant) {
      if (plant.nextWaterCheckOverride && isValidDateStr(plant.nextWaterCheckOverride)) {
        return plant.nextWaterCheckOverride;
      }
      if (!isValidDateStr(plant.lastWateredDate)) return null;
      return addDays(plant.lastWateredDate, Math.max(1, Number(plant.wateringIntervalDays) || 3));
    }

    function normalizePlantSchedules(plant) {
      const out = Object.assign({}, plant);
      if (!out.nextWaterCheckOverride && isValidDateStr(out.lastWateredDate)) {
        out.nextWaterCheckOverride = addDays(out.lastWateredDate, Math.max(1, Number(out.wateringIntervalDays) || 3));
      }
      if (out.soilPressureEnabled && !out.nextPressureDate) {
        const base = isValidDateStr(out.lastPressureDate) ? out.lastPressureDate : (isValidDateStr(out.startDate) ? out.startDate : getTodayStr());
        out.nextPressureDate = addDays(base, Math.max(1, Number(out.pressureIntervalDays) || 7));
      }
      return out;
    }

    function evaluateWateringStatus(plant) {
      const nextDate = computeNextWateringCheckDate(plant);
      const diff = nextDate ? diffDaysFromToday(nextDate) : null;
      const isDue = diff !== null && diff <= 0;

      if (plant.soilMoisture === '과습') {
        return {

        };
      }
      if (plant.soilMoisture === '적정(촉촉함)') {
        return {
          level: isDue ? 'warning' : 'good',
          badge: isDue ? '확인일 도래(촉촉함)' : '수분 적정',
          action: isDue ? '급수 보류 · 내일 다시 촉촉함 확인' : '현재 수분 적정 · 급수 보류',

            : '토양이 촉촉한 상태이므로 다음 점검일까지 물을 주지 않는 것이 좋습니다.'

      if (plant.soilMoisture === '건조') {

      if (isDue) {
        return {
          level: 'warning',
          badge: diff < 0 ? '확인 ' + Math.abs(diff) + '일 지남' : '오늘 물 확인',

        };
      }
      return {
        level: 'good',
        badge: nextDate ? formatDueBadge(nextDate) + ' 확인' : '상태 양호',
        action: '주기 도래 전 수분 관찰',

      };
    }

    function evaluateEnvironment(plant) {
      const guide = plant.aiGuide || {};
      const tempMin = typeof guide.optimalTempMin === 'number' ? guide.optimalTempMin : null;
      const tempMax = typeof guide.optimalTempMax === 'number' ? guide.optimalTempMax : null;
      const phMin = typeof guide.optimalPhMin === 'number' ? guide.optimalPhMin : null;
      const phMax = typeof guide.optimalPhMax === 'number' ? guide.optimalPhMax : null;

      let tempStatus = 'unknown', tempLabel = '기준 미설정', tempDeltaText = 'AI 생육 가이드 생성 후 비교 가능';
      if (typeof plant.currentTempC === 'number' && tempMin !== null && tempMax !== null) {
        if (plant.currentTempC < tempMin) {
          const d = (tempMin - plant.currentTempC).toFixed(1).replace(/\.0$/, '');
          tempStatus = Number(d) >= 4 ? 'danger' : 'warning';
          tempLabel = '적정보다 ' + d + '°C 낮음';
          tempDeltaText = '적정 ' + tempMin + '~' + tempMax + '°C 대비 ' + d + '°C 낮습니다. 따뜻한 창가나 보온을 고려하세요.';
        } else if (plant.currentTempC > tempMax) {
          const d = (plant.currentTempC - tempMax).toFixed(1).replace(/\.0$/, '');
          tempStatus = Number(d) >= 4 ? 'danger' : 'warning';
          tempLabel = '적정보다 ' + d + '°C 높음';
          tempDeltaText = '적정 ' + tempMin + '~' + tempMax + '°C 대비 ' + d + '°C 높습니다. 환기나 반그늘 이동이 필요합니다.';

          phStatus = Number(d) >= 0.7 ? 'danger' : 'warning';
          phLabel = '적정보다 pH ' + d + ' 낮음(산성)';

        } else if (plant.currentPh > phMax) {
          const d = (plant.currentPh - phMax).toFixed(1);
          phStatus = Number(d) >= 0.7 ? 'danger' : 'warning';
          phLabel = '적정보다 pH ' + d + ' 높음(알칼리)';
          phDeltaText = '적정 pH ' + phMin + '~' + phMax + '보다 높습니다. 피트모스 혼합 또는 중성수 관수를 권장합니다.';
        } else {
          phStatus = 'good';
          phLabel = '적정 범위';
          phDeltaText = '적정 토양 pH(' + phMin + '~' + phMax + ') 범위에 있습니다.';
        }
      }

      return { tempStatus, tempLabel, tempDeltaText, phStatus, phLabel, phDeltaText };

    function getOverallPlantStatus(plant) {
      const w = evaluateWateringStatus(plant);

      if (w.level === 'danger' || env.tempStatus === 'danger' || env.phStatus === 'danger') {

      }
      if (w.level === 'warning' || env.tempStatus === 'warning' || env.phStatus === 'warning') {

    function buildDailyTasks(plants) {
      const tasks = [];
      plants.forEach(function (plant) {
        const w = evaluateWateringStatus(plant);
        const nextWaterDate = computeNextWateringCheckDate(plant);
        const waterDiff = nextWaterDate ? diffDaysFromToday(nextWaterDate) : null;

        if (w.level === 'danger' || (waterDiff !== null && waterDiff <= 3)) {
          const isOver = plant.soilMoisture === '과습';
          const isDry = plant.soilMoisture === '건조';
          const isDue = waterDiff !== null && waterDiff <= 0;
          const priority = isOver || isDry || (waterDiff !== null && waterDiff < 0)
            ? 'urgent' : isDue ? 'today' : 'upcoming';
          tasks.push({
            id: plant.id + '-water',
            plantId: plant.id,
            plantName: plant.name,
            species: plant.species,
            category: 'water',
            priority: priority,
            dueDate: nextWaterDate || getTodayStr(),
            title: isOver ? '과습 점검 · 배수 확인' : isDry ? '긴급 물 주기 (토양 건조)' : w.shouldWaterNow ? '물 주기 및 토양 수분 확인' : '토양 수분 재확인 (급수 보류 권장)',
            description: w.reason,
            badgeText: nextWaterDate ? formatDueBadge(nextWaterDate) : w.badge
          });
        }

        if (plant.soilPressureEnabled && plant.nextPressureDate) {
          const pDiff = diffDaysFromToday(plant.nextPressureDate);
          if (pDiff !== null && pDiff <= 3) {
            tasks.push({
              id: plant.id + '-pressure',
              plantId: plant.id,
              plantName: plant.name,
              species: plant.species,
              category: 'pressure',
              priority: pDiff < 0 ? 'urgent' : pDiff === 0 ? 'today' : 'upcoming',
              dueDate: plant.nextPressureDate,
              title: '토양 압력(' + (plant.targetPressureKpa != null ? plant.targetPressureKpa + ' kPa' : '설정 조건') + ') 점검 및 유지',
              description: plant.pressureConditionNote || '설정한 재배 실험 압력 조건이 유지되고 있는지 확인하세요.',
              badgeText: formatDueBadge(plant.nextPressureDate)
            });
          }
        }

        const env = evaluateEnvironment(plant);
        if (env.phStatus === 'warning' || env.phStatus === 'danger') {
          tasks.push({
            id: plant.id + '-ph',
            plantId: plant.id,
            plantName: plant.name,
            species: plant.species,
            category: 'ph',
            priority: env.phStatus === 'danger' ? 'urgent' : 'today',
            dueDate: getTodayStr(),
            title: '토양 pH 조정 및 재측정 (' + env.phLabel + ')',
            description: env.phDeltaText,
            badgeText: 'pH ' + plant.currentPh
          });
        }
        if (env.tempStatus === 'warning' || env.tempStatus === 'danger') {
          tasks.push({
            id: plant.id + '-temp',
            plantId: plant.id,
            plantName: plant.name,
            species: plant.species,
            category: 'temp',
            priority: env.tempStatus === 'danger' ? 'urgent' : 'today',
            dueDate: getTodayStr(),
            title: '주변 온도 조절 (' + env.tempLabel + ')',
            description: env.tempDeltaText,
            badgeText: plant.currentTempC + '°C'
          });
        }
      });

      const rank = { urgent: 0, today: 1, upcoming: 2 };
      return tasks.sort(function (a, b) {
        if (rank[a.priority] !== rank[b.priority]) return rank[a.priority] - rank[b.priority];
        return (a.dueDate || '').localeCompare(b.dueDate || '');
      });
    }

    const CATEGORY_DEFAULTS = {
      herb: { tMin: 18, tMax: 25, pMin: 6.0, pMax: 7.0, water: 3, sun: '하루 4~6시간 밝은 빛과 원활한 통풍', press: '배수성과 통기성을 유지해 뿌리 호흡을 도우세요.' },
      leafy: { tMin: 15, tMax: 22, pMin: 6.0, pMax: 7.0, water: 2, sun: '밝은 간접광~오전 햇빛, 고온 주의', press: '연약한 잎과 뿌리를 위해 지나친 토양 압착을 피하세요.' },
      fruiting: { tMin: 20, tMax: 27, pMin: 6.0, pMax: 6.8, water: 2, sun: '하루 6시간 이상 충분한 햇빛과 지지대 확인', press: '수분과 영양 흡수가 활발하도록 흙의 공극을 적절히 유지하세요.' },
      houseplant: { tMin: 18, tMax: 26, pMin: 5.8, pMax: 6.8, water: 5, sun: '직사광선 피한 밝은 간접광', press: '배수구가 막히지 않도록 성긴 배합토 상태를 유지하세요.' },
      succulent: { tMin: 18, tMax: 28, pMin: 5.8, pMax: 6.8, water: 10, sun: '통풍 좋은 밝은 창가', press: '배수성 위주의 성긴 흙을 유지해 과습을 예방하세요.' },
      other: { tMin: 18, tMax: 25, pMin: 6.0, pMax: 7.0, water: 4, sun: '식물 잎 상태를 관찰하며 밝은 간접광 배치', press: '재배 실험 조건이 없다면 일반적인 배수성 토양을 권장합니다.' }
    };

    function generateBotanicalGuide(plant) {
      const speciesText = (plant.species || plant.name || '').toLowerCase();
      let matched = null;
      for (let i = 0; i < SPECIES_DB.length; i++) {
        if (SPECIES_DB[i].keys.some(function (k) { return speciesText.indexOf(k) !== -1; })) {
          matched = SPECIES_DB[i];
          break;
        }
      }
      const base = matched || CATEGORY_DEFAULTS[plant.category] || CATEGORY_DEFAULTS.other;
      let tMin = base.tMin;
      let tMax = base.tMax;
      let waterDays = base.water;
      let stageAdvice = '';

      if (plant.growthStage === 'seedling') {
        tMin = Math.min(tMax - 2, tMin + 1);
        waterDays = Math.max(1, Math.round(waterDays * 0.7));
        stageAdvice = '새싹 단계는 뿌리가 얕아 겉흙 건조에 민감하므로 흙 표면이 마르지 않게 약한 분무·저면 위주로 살펴보세요.';
      } else if (plant.growthStage === 'vegetative') {
        stageAdvice = '성장기에는 잎과 줄기가 빠르게 자라므로 충분한 빛과 일정한 물 주기 리듬이 중요합니다.';
      } else if (plant.growthStage === 'flowering') {
        stageAdvice = '개화기에는 급격한 온도 변화나 과습을 피하고 환기를 자주 해 꽃떨어짐을 줄여 주세요.';
      } else if (plant.growthStage === 'fruiting') {
        waterDays = Math.max(1, waterDays - 1);
        stageAdvice = '결실기에는 수분과 영양 요구량이 늘어나므로 토양 수분 편차를 줄이고 pH 6.0 이상을 안정적으로 유지하세요.';
      } else {
        waterDays = Math.min(30, Math.round(waterDays * 1.5));
        stageAdvice = '휴면기에는 증발·흡수량이 크게 줄어드므로 물 주기 간격을 넉넉히 늘려 과습을 예방하세요.';
      }

      const uncertaintyNotes = matched
        ? (plant.soilPressureEnabled ? '토양 압력(' + (plant.targetPressureKpa != null ? plant.targetPressureKpa + ' kPa' : '사용자 설정') + ')에 따른 생육 반응은 품종·배양토 배합마다 다르므로 대조군과 함께 직접 측정값을 비교해 확인하세요.' : null)
        : '입력하신 품종("' + (plant.species || plant.name) + '")에 대한 세부 품종 데이터베이스가 충분하지 않아 "' + (CATEGORY_META[plant.category] ? CATEGORY_META[plant.category].label : '기타') + '" 분류의 일반 권장 기준으로 안내했습니다. 실제 잎 처짐·흙 마름 속도를 보며 수치를 미세 조정해 주세요.';

      return {
        optimalTempMin: tMin,
        optimalTempMax: tMax,
        optimalPhMin: base.pMin,
        optimalPhMax: base.pMax,
        optimalMoistureText: plant.category === 'succulent'
          ? '속흙까지 완전히 마른 뒤 급수 (건조~약간 건조 권장)'
          : '겉흙 2~3cm가 말랐을 때 충분히 급수 후 배수',
        recommendedWateringDays: waterDays,
        sunlightVentilation: base.sun,
        pressureManagementNote: plant.soilPressureEnabled
          ? '설정하신 실험 압력(' + (plant.targetPressureKpa != null ? plant.targetPressureKpa + ' kPa' : '사용자 설정') + ')을 일정하게 유지하면서 대조군과 키·잎 수·뿌리 활력을 비교하세요. ' + base.press
          : base.press,
        stageSpecificTip: stageAdvice + (matched && matched.note ? ' ' + matched.note : ''),
        uncertaintyNotes: uncertaintyNotes,
        updatedAt: new Date().toISOString()
      };
    }

    function generateBotanicalCounsel(question, plant, allPlants) {

        if (/온도|추위|더위|햇빛|광합성|통풍|환기/.test(q)) {
          lines.push('');
          lines.push('3) 온도·빛·통풍 관리');
          lines.push('• ' + env.tempDeltaText);

            lines.push('• 권장 광·통풍 조건: ' + plant.aiGuide.sunlightVentilation);

      } else {

        lines.push('• 물 주기 기본 원칙: 정해진 날짜만 보고 기계적으로 물을 주기보다 겉흙 2~3cm의 실제 건조 여부를 먼저 확인하세요. 흙이 촉촉하거나 과습할 때는 급수를 보류해야 뿌리 부패를 막을 수 있습니다.');
        lines.push('• 실험 변인 통제: 토양 압력(kPa)이나 pH 실험을 진행할 때는 한 번에 여러 조건을 바꾸지 말고, 실험군과 대조군에 같은 빛·온도·급수 기준을 적용한 뒤 3~7일 간격으로 키(cm)와 잎 개수를 기록해 비교하세요.');
      }

      return lines.join('\n');
    }

    /* Storage & Safe Migration (Starts completely empty by default) */
    function loadState() {
      const defaults = {
        activeTab: 'home',
        plants: [],
        growthRecords: [],
        careLogs: [],
        chatMessages: [],
        selectedPlantId: null,
        aiContextPlantId: null,
        scheduleFilter: 'all',
        schedulePriorityFilter: 'all',
        homeTaskCategoryFilter: 'all',
        growthSelectedPlantId: null,
        growthCompareMode: false,
        growthCompareIds: [],
        growthMetric: 'heightCm'
      };

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const plants = Array.isArray(parsed.plants) ? parsed.plants.map(normalizePlantSchedules) : [];
          return Object.assign({}, defaults, parsed, {
            plants: plants,
            growthRecords: Array.isArray(parsed.growthRecords) ? parsed.growthRecords : [],
            careLogs: Array.isArray(parsed.careLogs) ? parsed.careLogs : [],
            chatMessages: Array.isArray(parsed.chatMessages) ? parsed.chatMessages : [],
            growthCompareIds: Array.isArray(parsed.growthCompareIds) ? parsed.growthCompareIds : []
          });
        }

        for (let i = 0; i < LEGACY_KEYS.length; i++) {
          const legacyRaw = localStorage.getItem(LEGACY_KEYS[i]);
          if (!legacyRaw) continue;
          const parsed = JSON.parse(legacyRaw);
          const nonSeedPlants = (Array.isArray(parsed.plants) ? parsed.plants : [])
            .filter(function (p) { return p && p.id && !SEED_PLANT_IDS.has(p.id); })
            .map(normalizePlantSchedules);
          const validIds = new Set(nonSeedPlants.map(function (p) { return p.id; }));
          const migrated = Object.assign({}, defaults, {
            plants: nonSeedPlants,
            growthRecords: (Array.isArray(parsed.growthRecords) ? parsed.growthRecords : []).filter(function (r) { return validIds.has(r.plantId); }),
            careLogs: (Array.isArray(parsed.careLogs) ? parsed.careLogs : []).filter(function (l) { return validIds.has(l.plantId); }),
            chatMessages: Array.isArray(parsed.chatMessages) ? parsed.chatMessages : []
          });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        }
      } catch (e) {
        console.warn('저장된 상태 불러오기 실패:', e);
      }
      return defaults;
    }

    let state = loadState();
    let toastTimer = null;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          plants: state.plants,
          growthRecords: state.growthRecords,
          careLogs: state.careLogs,
          chatMessages: state.chatMessages.slice(-40)
        }));
      } catch (e) {
        showToast('저장 공간이 부족합니다. 사진 크기를 줄여 주세요.', 'danger');
      }
    }

    function showToast(msg) {
      const root = document.getElementById('toast-root');
      if (!root) return;
      root.innerHTML = '<div class="toast" role="status"><span>' + esc(msg) + '</span><button type="button" id="toast-close" style="background:none;border:0;color:#a7f3d0;font-weight:700;">닫기</button></div>';
      const btn = document.getElementById('toast-close');
      if (btn) btn.onclick = function () { root.innerHTML = ''; };
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { root.innerHTML = ''; }, 3600);
    }

    function compressImageFile(file) {
      return new Promise(function (resolve, reject) {
        if (!file || !file.type || file.type.indexOf('image/') !== 0) {
          reject(new Error('이미지 파일만 업로드할 수 있습니다.'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = function () { reject(new Error('파일을 읽을 수 없습니다.')); };
        reader.onload = function () {
          const img = new Image();
          img.onerror = function () { reject(new Error('이미지를 불러오지 못했습니다.')); };
          img.onload = function () {
            const maxDim = 640;
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext('2d');
            if (!ctx) { resolve(reader.result); return; }
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.78));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function statusTag(level, text) {
      const cls = level === 'danger' ? 'status-danger' : level === 'warning' ? 'status-warning' : 'status-good';
      const icon = level === 'good' ? ICONS.check : ICONS.alert;
      return '<span class="status-tag ' + cls + '">' + icon + '<span>' + esc(text) + '</span></span>';
    }

    function getPlantById(id) {
      for (let i = 0; i < state.plants.length; i++) {
        if (state.plants[i].id === id) return state.plants[i];
      }
      return null;
    }

    function completeDailyTask(task) {
      const plant = getPlantById(task.plantId);
      if (!plant) return;
      const today = getTodayStr();
      let updated = Object.assign({}, plant);
      let logSummary = '';

      if (task.category === 'water') {
        const w = evaluateWateringStatus(plant);
        if (!w.shouldWaterNow) {
          updated.nextWaterCheckOverride = addDays(today, 1);
          logSummary = '오늘 급수 보류 (' + plant.soilMoisture + ') · 내일 재확인 예약';
        } else {
          updated.lastWateredDate = today;
          updated.soilMoisture = '적정(촉촉함)';
          updated.nextWaterCheckOverride = addDays(today, Math.max(1, Number(plant.wateringIntervalDays) || 3));
          logSummary = '물 주기 완료 · 토양 수분 적정(촉촉함)으로 기록';
        }
      } else if (task.category === 'pressure') {
        updated.lastPressureDate = today;
        updated.nextPressureDate = addDays(today, Math.max(1, Number(plant.pressureIntervalDays) || 7));
        logSummary = '토양 압력 점검 완료 (' + (plant.targetPressureKpa != null ? plant.targetPressureKpa + ' kPa' : '조건 유지') + ')';
      } else if (task.category === 'ph') {
        const guide = plant.aiGuide || {};
        if (typeof guide.optimalPhMin === 'number' && typeof guide.optimalPhMax === 'number') {
          updated.currentPh = Number(((guide.optimalPhMin + guide.optimalPhMax) / 2).toFixed(1));
        }
        logSummary = '토양 pH 점검 및 적정 범위 조정 (pH ' + updated.currentPh + ')';
      } else if (task.category === 'temp') {
        const guide = plant.aiGuide || {};
        if (typeof guide.optimalTempMin === 'number' && typeof guide.optimalTempMax === 'number') {
          updated.currentTempC = Math.round((guide.optimalTempMin + guide.optimalTempMax) / 2);
        }
        logSummary = '주변 온도 조절 완료 (' + updated.currentTempC + '°C)';
      }

      state.plants = state.plants.map(function (p) { return p.id === updated.id ? updated : p; });
      state.careLogs = [{
        id: uid('log'),
        plantId: plant.id,
        date: today,
        type: task.category,
        summary: logSummary,
        createdAt: new Date().toISOString()
      }].concat(state.careLogs).slice(0, 120);
      saveState();
      showToast(plant.name + ': ' + logSummary);
      render();
    }

    function setTab(tab) {
      state.activeTab = tab;
      if (tab !== 'plants') state.selectedPlantId = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderHome() {
      const plants = state.plants;
      const tasks = buildDailyTasks(plants);
      const urgentCount = tasks.filter(function (t) { return t.priority === 'urgent'; }).length;
      const todayCount = tasks.filter(function (t) { return t.priority === 'today'; }).length;
      const upcomingCount = tasks.filter(function (t) { return t.priority === 'upcoming'; }).length;
      const dueNow = urgentCount + todayCount;
      const filterCat = state.homeTaskCategoryFilter || 'all';
      const filteredTasks = filterCat === 'all' ? tasks : tasks.filter(function (t) { return t.category === filterCat; });

      const catBtns = [
        ['all', '전체'],
        ['water', '물 주기'],
        ['ph', '토양 pH 측정'],
        ['temp', '온도 확인'],
        ['pressure', '토양 압력 점검']
      ].map(function (item) {
        return '<button type="button" class="filter-btn ' + (filterCat === item[0] ? 'active' : '') + '" data-home-cat="' + item[0] + '">' + item[1] + '</button>';

        .map(function (p) {

      const nonEmpty = seriesList.filter(function (s) { return s.records.length > 0; });
      if (nonEmpty.length === 0) {
        return '<div class="sub-box" style="text-align:center;padding:30px;color:#64748b;font-size:13px;">표시할 성장 기록이 없습니다. 기록을 추가하면 시간 비례 변화 그래프가 표시됩니다.</div>';
      }

      const w = 680, h = 250, padL = 46, padR = 24, padT = 20, padB = 36;
      const plotW = w - padL - padR, plotH = h - padT - padB;
      const allPoints = [];
      nonEmpty.forEach(function (s) {
        s.records.forEach(function (r) {
          allPoints.push({ ts: new Date(r.date + 'T00:00:00').getTime(), date: r.date, val: Number(r[metric]) || 0 });
        });
      });
      const minTs = Math.min.apply(null, allPoints.map(function (p) { return p.ts; }));
      const maxTs = Math.max.apply(null, allPoints.map(function (p) { return p.ts; }));
      const spanTs = Math.max(1, maxTs - minTs);
      const rawMaxVal = Math.max.apply(null, allPoints.map(function (p) { return p.val; }));
      const maxVal = Math.max(metric === 'heightCm' ? 10 : 5, Math.ceil(rawMaxVal * 1.15));

      function xOf(ts) { return maxTs === minTs ? padL + plotW / 2 : padL + ((ts - minTs) / spanTs) * plotW; }
      function yOf(v) { return padT + plotH - (v / maxVal) * plotH; }

      let gridSvg = '';
      for (let i = 0; i <= 4; i++) {
        const val = Math.round((maxVal * i) / 4);
        const y = yOf(val);
        gridSvg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="#e2e8f0" stroke-dasharray="3 3" />'
          + '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#64748b">' + val + '</text>';
      }

      const uniqueDates = Array.from(new Set(allPoints.map(function (p) { return p.date; }))).sort();
      let lastX = -999;
      let dateLabelsSvg = '';
      uniqueDates.forEach(function (dStr, idx) {
        const ts = new Date(dStr + 'T00:00:00').getTime();
        const x = xOf(ts);
        if (idx === 0 || idx === uniqueDates.length - 1 || x - lastX >= 68) {
          dateLabelsSvg += '<text x="' + x + '" y="' + (h - 10) + '" text-anchor="middle" font-size="11" fill="#64748b">' + formatKoreanDate(dStr) + '</text>';
          lastX = x;
        }
      });

      const colors = ['#064e3b', '#65a30d', '#0284c7', '#d97706', '#dc2626'];
      let linesSvg = '';
      let legendHtml = '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;">';

      nonEmpty.forEach(function (s, idx) {
        const c = colors[idx % colors.length];
        const sorted = s.records.slice().sort(function (a, b) {
          return a.date !== b.date ? a.date.localeCompare(b.date) : (a.createdAt || '').localeCompare(b.createdAt || '');
        });
        const coords = sorted.map(function (r) {
          return { x: xOf(new Date(r.date + 'T00:00:00').getTime()), y: yOf(Number(r[metric]) || 0), r: r };
        });
        const pathD = coords.map(function (pt, i) { return (i === 0 ? 'M ' : 'L ') + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1); }).join(' ');
        if (coords.length > 1) {
          linesSvg += '<path d="' + pathD + '" fill="none" stroke="' + c + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />';
        }
        coords.forEach(function (pt) {
          linesSvg += '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="4.5" fill="' + c + '" stroke="#fff" stroke-width="1.5"><title>'
            + esc(s.plant.name + ' · ' + pt.r.date + ': ' + pt.r.heightCm + 'cm / 잎 ' + pt.r.leafCount + '장')
            + '</title></circle>';
        });
        legendHtml += '<span style="display:inline-flex;align-items:center;gap:6px;font-weight:600;"><span style="width:10px;height:10px;border-radius:99px;background:' + c + ';"></span>' + esc(s.plant.name) + '</span>';
      });
      legendHtml += '</div>';

      return '<div style="overflow-x:auto;">'
        + '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;min-width:460px;height:auto;display:block;">'
        + gridSvg + dateLabelsSvg + linesSvg
        + '</svg>'
        + '</div>' + legendHtml;
    }

        + '<button type="button" class="btn btn-primary btn-sm" data-action="open-growth-modal" data-plant-id="' + esc(state.growthSelectedPlantId) + '">+ 성장 기록 추가</button>'

        + '<button type="button" class="filter-btn ' + (metric === 'leafCount' ? 'active' : '') + '" data-growth-metric="leafCount">잎 개수 (장)</button>'
        + '</div>'
        + '</div>'

            ? '<div class="sub-box" style="text-align:center;padding:24px;font-size:13px;color:#64748b;">비교할 식물을 위에서 선택해 주세요.</div>'
            : renderGrowthChartSvg(seriesList, metric))
        + '</section>'
        + '<section class="card"><h2 class="section-title" style="margin-bottom:12px;">측정 타임라인 (' + visibleRecords.length + ')</h2>'
        + (visibleRecords.length === 0

                return '<div class="list-row">'

    /* Pure JS PKZIP (STORE method 0 + CRC32 + UTF-8 filenames) for GitHub/Vercel ZIP export */
    const CRC_TABLE = (function () {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c >>> 0;
      }
      return t;
    })();

    function crc32(bytes) {
      let c = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
      return (c ^ 0xffffffff) >>> 0;
    }

    function buildZipBlob(files) {
      const encoder = new TextEncoder();
      const now = new Date();
      const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() >> 1) & 31);
      const dosDate = (((Math.max(1980, now.getFullYear()) - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);
      const chunks = [];
      const central = [];
      let offset = 0;

      files.forEach(function (f) {
        const nameBytes = encoder.encode(f.name);
        const dataBytes = encoder.encode(f.content);
        const crc = crc32(dataBytes);

        const lf = new Uint8Array(30 + nameBytes.length);
        const dv = new DataView(lf.buffer);
        dv.setUint32(0, 0x04034b50, true);
        dv.setUint16(4, 20, true);
        dv.setUint16(6, 0x0800, true);
        dv.setUint16(8, 0, true);
        dv.setUint16(10, dosTime, true);
        dv.setUint16(12, dosDate, true);
        dv.setUint32(14, crc, true);
        dv.setUint32(18, dataBytes.length, true);
        dv.setUint32(22, dataBytes.length, true);
        dv.setUint16(26, nameBytes.length, true);
        dv.setUint16(28, 0, true);
        lf.set(nameBytes, 30);

        chunks.push(lf, dataBytes);

        const cd = new Uint8Array(46 + nameBytes.length);
        const cdv = new DataView(cd.buffer);
        cdv.setUint32(0, 0x02014b50, true);
        cdv.setUint16(4, 20, true);
        cdv.setUint16(6, 20, true);
        cdv.setUint16(8, 0x0800, true);
        cdv.setUint16(10, 0, true);
        cdv.setUint16(12, dosTime, true);
        cdv.setUint16(14, dosDate, true);
        cdv.setUint32(16, crc, true);
        cdv.setUint32(20, dataBytes.length, true);
        cdv.setUint32(24, dataBytes.length, true);
        cdv.setUint16(28, nameBytes.length, true);
        cdv.setUint16(30, 0, true);
        cdv.setUint16(32, 0, true);
        cdv.setUint16(34, 0, true);
        cdv.setUint16(36, 0, true);
        cdv.setUint32(38, 0, true);
        cdv.setUint32(42, offset, true);
        cd.set(nameBytes, 46);
        central.push(cd);

        offset += lf.length + dataBytes.length;
      });

      let cdSize = 0;
      central.forEach(function (c) { cdSize += c.length; });
      const eocd = new Uint8Array(22);
      const edv = new DataView(eocd.buffer);
      edv.setUint32(0, 0x06054b50, true);
      edv.setUint16(8, files.length, true);
      edv.setUint16(10, files.length, true);
      edv.setUint32(12, cdSize, true);
      edv.setUint32(16, offset, true);

      return new Blob(chunks.concat(central, [eocd]), { type: 'application/zip' });
    }

    function exportGithubZip() {
      const clone = document.documentElement.cloneNode(true);
      ['app-content', 'modal-root', 'toast-root'].forEach(function (id) {
        const el = clone.querySelector('#' + id);
        if (el) el.innerHTML = '';
      });
      Array.prototype.forEach.call(clone.querySelectorAll('script[src*="@vite"], script[type="module"]'), function (s) {
        if (s && s.parentNode) s.parentNode.removeChild(s);
      });
      const htmlContent = '<!doctype html>\n' + clone.outerHTML + '\n';
      const readmeContent = [
        '# GrowLab AI',
        '',
        '단일 `index.html` 파일로 구성된 스마트 식물 생육 및 재배 실험 관리 웹 앱입니다.',
        '',
        '## 특징',
        '- 프레임워크·빌드 도구 없이 `index.html` 단일 파일로 즉시 실행 가능 (파일 더블 클릭 `file://` 지원)',
        '- 브라우저 `localStorage`에 식물 정보, 물 주기, 토양 압력(kPa), 온도, 토양 pH, 성장 기록 영구 저장',
        '- GitHub에 그대로 업로드 후 Vercel에서 별도 빌드 설정 없이 즉시 정적 배포 가능',
        ''
      ].join('\n');

      const blob = buildZipBlob([
        { name: 'index.html', content: htmlContent },
        { name: 'README.md', content: readmeContent }
      ]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'growlab-ai-vercel.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast('GitHub/Vercel 배포용 ZIP 파일을 다운로드했습니다.');
    }

    function render() {
      Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (btn) {
        if (btn.classList.contains('top-nav-btn') || btn.classList.contains('bottom-nav-btn')) {
          btn.classList.toggle('active', btn.getAttribute('data-nav') === state.activeTab);
        }
      });

      const contentEl = document.getElementById('app-content');
      if (!contentEl) return;

      if (state.activeTab === 'home') contentEl.innerHTML = renderHome();
      else if (state.activeTab === 'plants') contentEl.innerHTML = renderPlants();
      else if (state.activeTab === 'schedule') contentEl.innerHTML = renderSchedule();
      else if (state.activeTab === 'growth') contentEl.innerHTML = renderGrowth();
      else if (state.activeTab === 'ai') contentEl.innerHTML = renderAiCounsel();

      const aiSelect = document.getElementById('ai-plant-select');
      if (aiSelect) {
        aiSelect.onchange = function (e) {
          state.aiContextPlantId = e.target.value || null;
          render();
        };
      }

      const aiForm = document.getElementById('ai-chat-form');
      if (aiForm) {
        aiForm.onsubmit = function (e) {
          e.preventDefault();
          const input = document.getElementById('ai-chat-input');
          const text = input ? input.value.trim() : '';
          if (!text) return;
          const ctxPlant = state.aiContextPlantId ? getPlantById(state.aiContextPlantId) : null;
          const answer = generateBotanicalCounsel(text, ctxPlant, state.plants);
          state.chatMessages = state.chatMessages.concat([
            { id: uid('msg'), role: 'user', content: text },
            { id: uid('msg'), role: 'assistant', content: answer }
          ]).slice(-40);
          saveState();
          render();
          const box = document.getElementById('chat-box');
          if (box) box.scrollTop = box.scrollHeight;
        };
      }
    }

    document.getElementById('btn-open-register').onclick = function () { openPlantModal(null); };
    document.getElementById('btn-download-zip').onclick = exportGithubZip;

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });

    document.addEventListener('click', function (e) {
      const navBtn = e.target.closest('[data-nav]');
      if (navBtn) { setTab(navBtn.getAttribute('data-nav')); return; }

      const homeCat = e.target.closest('[data-home-cat]');
      if (homeCat) { state.homeTaskCategoryFilter = homeCat.getAttribute('data-home-cat'); render(); return; }

      const schedCat = e.target.closest('[data-sched-cat]');
      if (schedCat) { state.scheduleFilter = schedCat.getAttribute('data-sched-cat'); render(); return; }

      const schedPri = e.target.closest('[data-sched-pri]');
      if (schedPri) { state.schedulePriorityFilter = schedPri.getAttribute('data-sched-pri'); render(); return; }

      const gpBtn = e.target.closest('[data-growth-plant]');
      if (gpBtn) { state.growthSelectedPlantId = gpBtn.getAttribute('data-growth-plant'); render(); return; }

      const gcBtn = e.target.closest('[data-toggle-compare]');
      if (gcBtn) {
        const id = gcBtn.getAttribute('data-toggle-compare');
        if (state.growthCompareIds.indexOf(id) !== -1) {
          state.growthCompareIds = state.growthCompareIds.filter(function (x) { return x !== id; });
        } else {
          state.growthCompareIds = state.growthCompareIds.concat([id]);
        }
        render();
        return;
      }

      const gmBtn = e.target.closest('[data-growth-metric]');
      if (gmBtn) { state.growthMetric = gmBtn.getAttribute('data-growth-metric'); render(); return; }

      const quickBtn = e.target.closest('[data-quick-q]');
      if (quickBtn) {
        const qText = quickBtn.textContent.trim();
        const input = document.getElementById('ai-chat-input');
        const form = document.getElementById('ai-chat-form');
        if (input && form) {
          input.value = qText;
          form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }
        return;
      }

      const actBtn = e.target.closest('[data-action]');
      if (!actBtn) return;
      const action = actBtn.getAttribute('data-action');

      if (action === 'open-register') {
        openPlantModal(null);
      } else if (action === 'open-plant') {
        state.selectedPlantId = actBtn.getAttribute('data-id');
        state.activeTab = 'plants';
        render();
      } else if (action === 'close-detail') {
        state.selectedPlantId = null;
        render();
      } else if (action === 'edit-plant') {
        const p = getPlantById(actBtn.getAttribute('data-id'));
        if (p) openPlantModal(p);
      } else if (action === 'delete-plant') {
        const p = getPlantById(actBtn.getAttribute('data-id'));
        if (p) openDeleteConfirmModal(p);
      } else if (action === 'regen-guide') {
        const p = getPlantById(actBtn.getAttribute('data-id'));
        if (p) {
          const updated = Object.assign({}, p, { aiGuide: generateBotanicalGuide(p) });
          state.plants = state.plants.map(function (item) { return item.id === updated.id ? updated : item; });
          saveState();
          showToast(updated.name + ' 맞춤 생육 가이드를 업데이트했습니다.');
          render();
        }
      } else if (action === 'open-care') {
        openCareModal(actBtn.getAttribute('data-id'), actBtn.getAttribute('data-mode'));
      } else if (action === 'complete-task') {
        const taskId = actBtn.getAttribute('data-task-id');
        const tasks = buildDailyTasks(state.plants);
        const found = tasks.find(function (t) { return t.id === taskId; });
        if (found) completeDailyTask(found);
      } else if (action === 'toggle-compare-mode') {
        state.growthCompareMode = !state.growthCompareMode;
        if (state.growthCompareMode && state.growthCompareIds.length === 0 && state.plants.length > 0) {
          state.growthCompareIds = state.plants.slice(0, 2).map(function (p) { return p.id; });
        }
        render();
      } else if (action === 'open-growth-modal') {
        openGrowthModal(actBtn.getAttribute('data-plant-id'), null);
      } else if (action === 'edit-growth') {
        const rid = actBtn.getAttribute('data-id');
        const rec = state.growthRecords.find(function (r) { return r.id === rid; });
        if (rec) openGrowthModal(rec.plantId, rec);
      } else if (action === 'delete-growth') {
        const rid = actBtn.getAttribute('data-id');
        state.growthRecords = state.growthRecords.filter(function (r) { return r.id !== rid; });
        saveState();
        showToast('성장 기록을 삭제했습니다.');
        render();
      } else if (action === 'ask-ai') {
        state.aiContextPlantId = actBtn.getAttribute('data-id');
        setTab('ai');
      } else if (action === 'clear-chat') {
        state.chatMessages = [];
        saveState();
        render();
      }
    });

    render();
  })();
  </script>
